<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CaliTracker | Calisthenics Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="glass-header">
            <div class="logo">
                <span class="logo-accent">Cali</span>Tracker
            </div>
            <div id="streak-badge" class="badge" style="cursor:pointer;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.5 3.5 6.5 1 1.5 2 3 2 5a6 6 0 1 1-12 0c0-1.38.5-3 1-4 1.5 1.5 3 3 3 4.5z"/></svg>
                <span id="streak-count">0</span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="view-container">
            <!-- Views will be injected here via app.js -->
        </main>

        <!-- Modal for Exercise Picker -->
        <div id="exercise-modal" class="modal-overlay hidden">
            <div class="modal-content glass">
                <div class="modal-header">
                    <h2>Select Exercise</h2>
                    <button id="close-modal" class="close-btn">&times;</button>
                </div>
                <div id="modal-exercise-list" class="modal-list">
                    <!-- Exercises will be injected here -->
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="glass-nav">
            <button class="nav-btn active" data-view="dashboard">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                <span>Home</span>
            </button>
            <button class="nav-btn" data-view="workout">
                <div class="plus-btn-outer">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </div>
            </button>
            <button class="nav-btn" data-view="history">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                <span>History</span>
            </button>
        </nav>
    </div>

    <!-- Templates for Dynamic Content -->
    <template id="tpl-auth">
        <div class="view-content fade-in auth-view">
            <div class="auth-card glass">
                <div class="text-center mb-20">
                    <span class="logo-accent" style="font-size: 2rem; font-weight: 800;">Cali</span><span style="font-size: 2rem; font-weight: 800;">Tracker</span>
                </div>
                
                <div id="login-form">
                    <h2>Welcome Back</h2>
                    <input type="email" id="login-email" placeholder="Email Address">
                    <input type="password" id="login-password" placeholder="Password">
                    <button id="login-btn" class="btn primary mt-10">Login</button>
                    <p class="text-center mt-20 text-secondary">
                        New here? <a href="#" id="show-signup" style="color:var(--accent-color);">Create Account</a>
                    </p>
                </div>

                <div id="signup-form" class="hidden">
                    <h2>Join CaliTracker</h2>
                    <input type="text" id="signup-name" placeholder="Full Name">
                    <input type="email" id="signup-email" placeholder="Email Address">
                    <input type="password" id="signup-password" placeholder="Password">
                    <button id="signup-btn" class="btn primary mt-10">Sign Up</button>
                    <p class="text-center mt-20 text-secondary">
                        Already have an account? <a href="#" id="show-login" style="color:var(--accent-color);">Log In</a>
                    </p>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-dashboard">
        <div class="view-content fade-in">
            <h1>Welcome Back</h1>
            
            <!-- Goal Section -->
            <div class="goal-card glass mb-20">
                <div class="goal-header">
                    <span class="stat-label">Weekly Goal</span>
                    <span id="goal-progress" class="goal-value">0/0</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="goal-bar" class="progress-bar" style="width: 0%"></div>
                </div>
                <button id="set-goal-btn" class="text-btn">Set Weekly Goal</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card glass" data-view="history" style="cursor:pointer;">
                    <span class="stat-label">Total Workouts</span>
                    <span id="stat-total" class="stat-value">0</span>
                </div>
                <div class="stat-card glass" data-view="streak" style="cursor:pointer;">
                    <span class="stat-label">Best Streak</span>
                    <span id="stat-best-streak" class="stat-value">0</span>
                </div>
            </div>

            <div class="action-section mb-20">
                <h2>Features</h2>
                <div class="features-grid">
                    <button class="feature-card glass" data-view="ai-generator">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10H12V2z"></path><path d="M12 12L2.1 12.1"></path><path d="M12 12v10"></path><path d="M12 12l7.1 7.1"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <span>AI Generator</span>
                    </button>
                    <button class="feature-card glass" data-view="progress">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
                        <span>Progress</span>
                    </button>
                    <button class="feature-card glass" data-view="profile">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        <span>Profile</span>
                    </button>
                    <button class="feature-card glass" data-view="history">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        <span>History</span>
                    </button>
                </div>
            </div>

            <div class="action-section">
                <h2>Quick Start</h2>
                <div id="quick-start-list" class="exercise-list">
                    <!-- Exercise categories or quick-log items -->
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-streak">
        <div class="view-content fade-in">
            <div class="header-with-back">
                <button onclick="UI.renderView('dashboard')" class="back-btn">←</button>
                <h1>Streak Statistics</h1>
            </div>
            
            <div class="streak-hero glass mb-20 p-20 text-center" style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
                <div class="streak-icon-large" style="margin-bottom:10px;">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="var(--accent-color)" stroke="var(--accent-color)" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.5 3.5 6.5 1 1.5 2 3 2 5a6 6 0 1 1-12 0c0-1.38.5-3 1-4 1.5 1.5 3 3 3 4.5z"/></svg>
                </div>
                <h2 id="current-streak-val" style="font-size: 3rem; color: var(--accent-color); margin:0;">0</h2>
                <p class="text-secondary">Current Day Streak</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card glass">
                    <span class="stat-label">Best Streak</span>
                    <span id="streak-best-val" class="stat-value">0</span>
                </div>
                <div class="stat-card glass">
                    <span class="stat-label">Last Workout</span>
                    <span id="streak-last-val" class="stat-value" style="font-size:1rem;">None</span>
                </div>
            </div>

            <div class="calendar-card glass p-20 mt-20">
                <h3 class="mb-10">Last 30 Days</h3>
                <div id="activity-calendar" style="display:grid; grid-template-columns: repeat(7, 1fr); gap:5px;">
                    <!-- Activity dots will be injected here -->
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-workout">
        <div class="view-content fade-in">
            <div class="workout-header">
                <h1>Active Session</h1>
                <div id="workout-timer" class="timer">00:00</div>
            </div>

            <!-- Quote Container -->
            <div id="quote-container" class="quote-card glass mb-20">
                <p id="motivation-quote">"The only bad workout is the one that didn't happen."</p>
            </div>

            <div id="active-exercises" class="active-exercises">
                <!-- Active exercise sets -->
            </div>
            
            <div id="break-timer-container" class="break-timer-card glass hidden mb-20">
                <div class="break-header">
                    <span>Resting...</span>
                    <span id="break-timer-val">00:00</span>
                </div>
                <button id="skip-break-btn" class="btn secondary sm">Skip Break</button>
            </div>

            <div class="workout-controls">
                <div class="dual-btns">
                    <button id="add-exercise-btn" class="btn secondary">Add Exercise</button>
                    <button id="start-break-btn" class="btn secondary">Start Break</button>
                </div>
                <button id="save-workout-btn" class="btn secondary">Save Progress</button>
                <button id="finish-workout-btn" class="btn primary">Finish Session</button>
            </div>
        </div>
    </template>

    <template id="tpl-history">
        <div class="view-content fade-in">
            <div class="header-with-back">
                <button onclick="UI.renderView('profile')" class="back-btn">←</button>
                <h1>Workout History</h1>
            </div>
            <div id="history-list" class="history-list">
                <!-- History items will be injected here -->
                <div class="empty-state">No workouts logged yet. Time to hit the bars!</div>
            </div>
        </div>
    </template>

    <template id="tpl-ai-generator">
        <div class="view-content fade-in">
            <h1>AI Workout Generator</h1>
            <div class="ai-form glass p-20">
                <div class="input-group mb-10">
                    <label>Fitness Level</label>
                    <select id="ai-level">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>
                <div class="input-group mb-10">
                    <label>Goal</label>
                    <select id="ai-goal">
                        <option value="strength">Strength</option>
                        <option value="hypertrophy">Muscle Gain</option>
                        <option value="endurance">Endurance</option>
                        <option value="skills">New Skills</option>
                    </select>
                </div>
                <div class="input-group mb-10">
                    <label>Available Equipment</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" value="pullup-bar" checked> Pull-up Bar</label>
                        <label><input type="checkbox" value="dip-bars" checked> Dip Bars</label>
                        <label><input type="checkbox" value="rings"> Rings</label>
                        <label><input type="checkbox" value="resistance-bands"> Bands</label>
                    </div>
                </div>
                <button id="generate-ai-btn" class="btn primary">Generate Routine</button>
            </div>
            <div id="ai-result" class="mt-20 hidden">
                <div class="glass p-20">
                    <h2 id="ai-routine-name">Custom Routine</h2>
                    <div id="ai-exercises-list"></div>
                    <button id="start-ai-workout" class="btn secondary mt-10">Start This Workout</button>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-progress">
        <div class="view-content fade-in">
            <h1>Progress Tracking</h1>
            <div class="stats-tabs mb-20">
                <button class="tab-btn active" data-tab="stats">Statistics</button>
                <button class="tab-btn" data-tab="photos">Photos</button>
            </div>
            <div id="progress-stats-view">
                <div class="chart-container glass mb-20">
                    <canvas id="volume-chart"></canvas>
                </div>
                <div class="pr-list glass p-15">
                    <h3>Personal Records</h3>
                    <div id="pr-items">
                        <!-- PRs will be injected here -->
                    </div>
                </div>
            </div>
            <div id="progress-photos-view" class="hidden">
                <div class="photo-grid" id="photo-gallery">
                    <div class="add-photo-card glass" onclick="UI.renderView('camera')">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                        <span>Take Photo</span>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-camera">
        <div class="view-content fade-in camera-view">
            <div class="camera-container">
                <video id="camera-feed" autoplay playsinline></video>
                <canvas id="pose-canvas"></canvas>
                <div class="camera-controls">
                    <button id="capture-btn" class="capture-btn"></button>
                    <button id="close-camera" class="btn-icon">×</button>
                    <button id="toggle-pose" class="btn-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </button>
                </div>
            </div>
            <div id="pose-feedback" class="glass pose-feedback hidden">
                <p>Form Analysis Active</p>
            </div>
        </div>
    </template>

    <template id="tpl-profile">
        <div class="view-content fade-in">
            <div class="profile-header mb-30">
                <div class="profile-pic">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <div>
                    <h1 id="user-name-display" style="margin:0;">Guest User</h1>
                    <p id="user-email-display" class="text-secondary">Sign in to sync data</p>
                </div>
            </div>
            
            <div class="settings-list glass">
                <div class="settings-item" onclick="UI.renderView('history')" style="cursor:pointer;">
                    <span>Workout History</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </div>
                <div class="settings-item" id="account-settings-btn" style="cursor:pointer;">
                    <span>Account Settings</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </div>
                <div class="settings-item">
                    <span>Units (kg/lbs)</span>
                    <select id="unit-select">
                        <option value="kg">kg</option>
                        <option value="lbs">lbs</option>
                    </select>
                </div>
                <div class="settings-item" id="logout-btn-container">
                    <button id="logout-btn" class="text-btn" style="color:var(--danger);">Log Out</button>
                </div>
            </div>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
